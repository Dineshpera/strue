name: Daily inspection

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC = 07:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "recipes/**"
      - "runner/**"
      - ".github/workflows/inspect.yml"
  pull_request:
    paths:
      - "recipes/**"
      - "runner/**"

concurrency:
  group: strue-inspection
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs third-party install commands, so this job gets no write access and no
  # signing rights. It only produces a result file.
  inspect:
    name: Inspect on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install runner dependency
        run: python -m pip install pyyaml
      - name: Run every recipe from an empty folder
        shell: bash
        run: >
          python runner/run.py
          --os "${{ matrix.os }}"
          --out "out/${{ matrix.os }}.json"
          ${{ github.event_name == 'pull_request' && '--strict' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: result-${{ matrix.os }}
          path: out/${{ matrix.os }}.json
          if-no-files-found: error

  # Runs only this repository's own code. Signs the three result files, adds
  # them to the permanent record and rebuilds the status page.
  record:
    name: Sign and record
    needs: inspect
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pyyaml
      - uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: incoming
          merge-multiple: true
      - name: Sign the results
        uses: actions/attest@v4
        with:
          subject-path: "incoming/*.json"
      - name: Add to the record, rebuild the site and push
        # Rebuilds on top of the newest main each attempt, so two runs finishing
        # close together can never conflict. incoming/ is git-ignored and survives
        # the reset.
        run: |
          day="$(date -u +%F)"
          git config user.name "strue-inspector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            mkdir -p "results/$day"
            cp incoming/*.json "results/$day/"
            python runner/build_site.py --repo "$GITHUB_REPOSITORY"
            git add results docs
            if git diff --cached --quiet; then
              echo "Nothing changed."
              exit 0
            fi
            git commit -m "Inspection $day"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Someone else pushed first. Retrying (attempt $attempt)."
            sleep $((attempt * 15))
          done
          echo "Could not push after 4 attempts."
          exit 1
